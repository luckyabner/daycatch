name: Daycatch
options:
  bundleIdPrefix: com.luckyabner
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - Base
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # 自动更新。更新源是 GitHub Release 上的 appcast.xml（见 docs/updates.md）
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 没有开发者证书：统一使用 ad-hoc 签名
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # 版本号默认值；make build / make release 会用 git tag 和提交数覆盖
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # ---- Sparkle ----
    # appcast 走 releases/latest/download，发新版本时地址不变，不用改这里
    SPARKLE_FEED_URL: https://github.com/luckyabner/daycatch/releases/latest/download/appcast.xml
    # EdDSA 公钥（私钥在 .signing/sparkle_ed25519.key，见 docs/updates.md）
    SPARKLE_PUBLIC_KEY: "ZKBJvsoeR/mJeSQe4h8M/A9yYen3wRiFM3lTC5nWEaE="

targets:
  Daycatch:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Daycatch
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    info:
      path: Daycatch/Info.plist
      properties:
        CFBundleDisplayName: Daycatch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        # Sparkle：更新源、用于校验更新包的 EdDSA 公钥、启动时自动检查
        SUFeedURL: "$(SPARKLE_FEED_URL)"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: Daycatch 会把你确认过的日程写入「日历」，撤销时删除刚写入的日程。
        NSRemindersFullAccessUsageDescription: Daycatch 会把你确认过的待办写入「提醒事项」，撤销时删除刚写入的待办。
        NSCalendarsUsageDescription: Daycatch 会把你确认过的日程写入「日历」。
        NSRemindersUsageDescription: Daycatch 会把你确认过的待办写入「提醒事项」。
    entitlements:
      path: Daycatch/Daycatch.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        # 没有 Developer ID，签名证书是项目内自签的，没有 Team ID；开启硬化运行时后
        # dyld 的 library validation 会拒绝加载 Sparkle.framework（两边 Team ID 对不上）。
        # 换取一个能用的自动更新：只关掉这一项，硬化运行时的其它保护（W^X 等）仍然生效。
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luckyabner.daycatch
        PRODUCT_NAME: Daycatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # ad-hoc 签名时 Xcode 不会自动加 runtime 选项，这里显式开启 Hardened Runtime
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        # Debug 默认会把代码拆进单独的 .debug.dylib；ad-hoc 签名没有 Team ID，开启库校验后可能加载失败
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  DaycatchTests:
    type: bundle.unit-test
    platform: macOS
    # 不挂宿主 App：直接把纯逻辑源码编进测试包，测试时不会启动菜单栏应用
    sources:
      - DaycatchTests
      - Daycatch/Model
      - Daycatch/AI
      - Daycatch/Localization
      - Daycatch/Hotkeys/Shortcut.swift
      - Daycatch/Settings/CredentialStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luckyabner.daycatch.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  Daycatch:
    build:
      targets:
        # 测试不挂宿主 App，跑测试时不重新编译 App，免得覆盖掉 scripts/sign.sh 的签名
        Daycatch: [run, profile, analyze, archive]
        DaycatchTests: [test]
    test:
      targets:
        - DaycatchTests
    run:
      config: Debug
